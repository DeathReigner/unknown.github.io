<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>oksí</title>
<link rel="icon" type="image/png" href="assets/headreport.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height: 100%;
    height: 100dvh;
    width: 100%;
    background: #000000;
    color: #ffffff;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow-x: hidden;
  }

  header {
    width: 100%;
    text-align: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 16px;
    font-size: clamp(18px, 5vw, 24px);
    letter-spacing: 1px;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px calc(40px + env(safe-area-inset-bottom, 0px));
    gap: 28px;
  }

  .message {
    font-size: clamp(20px, 6vw, 28px);
  }

  main img {
    max-width: 280px;
    width: 80vw;
    height: auto;
    display: block;
  }

  figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  figcaption {
    font-size: 13px;
    color: #a8a8a8;
    font-style: italic;
  }
</style>
</head>
<body>

<main>
  <div class="message">ah, q rollo amor :c</div>
  <figure>
    <img src="assets/1.png" alt="">
    <figcaption>yo, soy ese</figcaption>
  </figure>
</main>

</body>
</html>
